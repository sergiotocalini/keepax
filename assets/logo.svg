<svg xmlns="http://www.w3.org/2000/svg" width="500" height="160" viewBox="0 0 500 160" role="img" aria-labelledby="title desc">
  <title id="title">keepax</title>
  <desc id="desc">Two keepalived nodes (MASTER and BACKUP) sharing a floating virtual IP, joined by a VRRP heartbeat.</desc>
  <style>
    .word { fill: #16425b; }
    .sub  { fill: #5b7083; }
    @media (prefers-color-scheme: dark) {
      .word { fill: #e6eef3; }
      .sub  { fill: #9fb3c2; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a3d"/>
      <stop offset="1" stop-color="#16425b"/>
    </linearGradient>
  </defs>

  <!-- emblem -->
  <rect x="8" y="8" width="144" height="144" rx="28" fill="url(#bg)"/>

  <!-- floating VIP -->
  <circle cx="80" cy="42" r="14" fill="none" stroke="#7fd1ae" stroke-width="3" stroke-dasharray="5 4"/>
  <circle cx="80" cy="42" r="5" fill="#7fd1ae"/>
  <path d="M80 56 L46 92 M80 56 L114 92" stroke="#7fd1ae" stroke-width="2" stroke-opacity="0.45" fill="none"/>

  <!-- MASTER node -->
  <rect x="26" y="92" width="40" height="40" rx="9" fill="#2bb673"/>
  <text x="46" y="117" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2a3d" text-anchor="middle">M</text>

  <!-- BACKUP node -->
  <rect x="94" y="92" width="40" height="40" rx="9" fill="none" stroke="#f2b84b" stroke-width="3"/>
  <text x="114" y="117" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#f2b84b" text-anchor="middle">B</text>

  <!-- VRRP heartbeat between nodes -->
  <polyline points="66,112 72,112 75,104 79,120 83,106 86,112 94,112" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- wordmark -->
  <text x="178" y="92" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="700" class="word" letter-spacing="-1">keep<tspan fill="#2bb673">ax</tspan></text>
  <text x="181" y="122" font-family="Helvetica, Arial, sans-serif" font-size="16" class="sub">Keepalived / VRRP monitoring for Zabbix</text>
</svg>
